name: release

on:
  push:
    branches:
      - main
    # Deploy only when something the shipped Lambda is built from changes;
    # infra/docs-only pushes don't redeploy ([skip ci] still covers one-offs).
    paths:
      - "src/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/main.yml"

env:
  CARGO_TERM_COLOR: always

# Least privilege for GITHUB_TOKEN: contents to check out the code, id-token
# to mint the OIDC token AWS trades for the deploy role — no static AWS keys
# anywhere in this repo.
permissions:
  contents: read
  id-token: write

# One deploy at a time, in order; never cancel a mid-flight prod deploy.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # keep in sync with rust-toolchain.toml — this action's RUSTUP_TOOLCHAIN
      # env overrides the file, so an unpinned channel here is what actually builds
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-07-02
        with:
          toolchain: nightly-2026-05-15
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          cache-all-crates: "true"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.4"
      - run: bun install --frozen-lockfile
        working-directory: web
      # Lint gate: biome with --error-on-warnings — warnings fail the deploy.
      - run: bun run lint
        working-directory: web
      - run: bun run build
        working-directory: web
      - run: pip3 install cargo-lambda==1.9.1
      - run: cargo lambda build --release --arm64 --features embed-web

      # Short-lived credentials via GitHub OIDC: the role trusts only pushes
      # to this repo's main branch and can only update the one Lambda — it
      # cannot create or rewire IAM roles, unlike the retired static deploy
      # user. Runs after the build so the ~15-min build can't outlive the
      # 1-hour session in a pathological cache-miss case.
      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-1

      # OAuth: the client secret + session signing key are secrets passed via
      # `env:` and quoted shell vars; the client id and admin login are
      # non-secret repo variables. Unset values become empty -> the Lambda
      # treats the admin as "not configured" rather than breaking the deploy.
      - run: >-
          cargo lambda deploy accept-payments --enable-function-url
          --env-var DB_TABLE=accept-payments-posts
          --env-var PAYMENTS_TABLE=accept-payments-payments
          --env-var INVOICES_TABLE=accept-payments-invoices
          --env-var STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY"
          --env-var STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET"
          --env-var OAUTH_CLIENT_ID=${{ vars.OAUTH_CLIENT_ID }}
          --env-var OAUTH_CLIENT_SECRET="$OAUTH_CLIENT_SECRET"
          --env-var SESSION_SECRET="$SESSION_SECRET"
          --env-var ADMIN_GITHUB_LOGIN=${{ vars.ADMIN_GITHUB_LOGIN }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      # Drift gate: PITR on the financial tables is declared in
      # infra/storage.tf; fail the deploy if the live tables ever disagree
      # (e.g. a console toggle), so backup posture can't rot silently.
      - name: Verify PITR on the financial tables
        run: |
          set -euo pipefail
          for t in accept-payments-payments accept-payments-invoices; do
            status=$(aws dynamodb describe-continuous-backups --table-name "$t" \
              --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus' \
              --output text)
            if [ "$status" != "ENABLED" ]; then
              echo "::error::PITR is $status on $t — must be ENABLED (declared in infra/storage.tf)"
              exit 1
            fi
            echo "$t: PITR $status"
          done
